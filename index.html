<style>
:root{
  --charcoal:#4a4a4a; --charcoal-deep:#333331; --charcoal-2:#3d3d3b;
  --gold:#cca735; --gold-light:#e0c468; --gold-dark:#a9862a;
  --cream:#f5f3ee; --card:#fffdf8; --ink:#2a2a28; --muted:#6b6a63;
  --border:#e4dfd0; --page:#f6f4ee; --field:#fff; --row-alt:#faf8f2; --line-soft:#f0ede4;
  --ok:#3a7a4a; --ok-bg:#e7f0e3; --red:#b53a3a; --red-bg:#f8e9e9; --on-gold:#2a2a28;
  --radius:14px; --radius-sm:10px; --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.07);
  --shadow-lg:0 20px 60px rgba(0,0,0,.35);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tab-h:64px;
}
html[data-theme="dark"]{
  --page:#1b1b1a; --card:#252523; --field:#1f1f1d; --cream:#2f2e2b; --row-alt:#292826; --line-soft:#363531;
  --ink:#ecebe5; --muted:#a9a79d; --border:#3d3b36; --gold-dark:#d4b04a; --on-gold:#1b1b1a;
  --red:#e07070; --red-bg:#3b2323; --ok:#8fc79d; --ok-bg:#223127;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));min-height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--field);
  border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input[type=checkbox]{width:auto;accent-color:var(--gold-dark)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.i.sm{width:15px;height:15px}

/* ---------- header ---------- */
header.app{background:var(--charcoal);border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:60;
  display:flex;align-items:center;justify-content:space-between;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));
  box-shadow:0 3px 14px rgba(0,0,0,.3)}
header.app img{height:40px;width:auto;display:block}
.hdr-right{display:flex;align-items:center;gap:10px}
.hdr-title{color:var(--gold-light);font-weight:800;letter-spacing:.8px;text-transform:uppercase;font-size:12px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;
  background:var(--charcoal-2);border:1.5px solid var(--gold);color:var(--gold-light)}
.icon-btn:hover{background:var(--gold);color:var(--charcoal-deep)}

/* ---------- layout ---------- */
main{max-width:1240px;margin:0 auto;padding:16px 14px 24px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.page-head h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.2px}
.page-head .sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--border);background:var(--card);border-radius:var(--radius-sm);
  padding:8px 14px;font-weight:700;font-size:13px;min-height:38px;transition:transform .08s,background .15s}
.btn:hover{background:var(--cream)}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.gold:hover{background:var(--gold-light)}
.btn.dark{background:var(--charcoal);border-color:var(--charcoal);color:var(--gold-light)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--border))}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;min-height:30px;font-size:12px}
.seg{display:inline-flex;background:var(--cream);border-radius:12px;padding:3px;gap:2px;border:1px solid var(--border)}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--charcoal);color:var(--gold-light);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;background:var(--cream);color:var(--muted);border:1px solid var(--border)}
.pill.gold{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold-dark);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.red{background:var(--red-bg);color:var(--red);border-color:transparent}

.av{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
  font-size:10.5px;font-weight:800;color:#fff;border:2px solid var(--card);flex-shrink:0;letter-spacing:.2px}
.av.lg{width:34px;height:34px;font-size:12.5px}
.av.xs{width:20px;height:20px;font-size:8.5px;border-width:1.5px}
.av-stack{display:inline-flex}
.av-stack .av+.av{margin-left:-8px}

/* ---------- bottom tabs ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--charcoal-deep);
  padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #000;box-shadow:0 -4px 20px rgba(0,0,0,.3)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
nav.tabs button{background:none;border:0;color:#a9a79d;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:11px;font-weight:700;letter-spacing:.3px;position:relative;transition:color .15s}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--gold-light)}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:var(--gold)}
nav.tabs button .badge{position:absolute;top:8px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--gold);color:var(--charcoal-deep);
  font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* ---------- schedule ---------- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .grow{flex:1}
.weeklabel{font-weight:800;font-size:15px;min-width:150px;text-align:center;white-space:nowrap}
.nav-grp{display:flex;align-items:center;gap:4px}
.week-wrap{overflow:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);box-shadow:var(--shadow);max-height:calc(100vh - 290px);min-height:260px}
table.week{border-collapse:separate;border-spacing:0;width:100%;min-width:900px;table-layout:fixed}
table.week th,table.week td{border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);vertical-align:top}
table.week thead th{position:sticky;top:0;z-index:5;background:var(--charcoal);color:#fff;padding:9px 6px;font-size:12px;text-align:center}
table.week thead th.today{background:var(--gold);color:var(--on-gold)}
table.week thead th .dn{font-size:17px;font-weight:800;display:block;line-height:1.1}
table.week thead th:first-child,table.week td.rowh{width:150px;position:sticky;left:0;z-index:4}
table.week thead th:first-child{z-index:6;text-align:left;padding-left:12px}
td.rowh{background:var(--card);padding:10px 10px;border-right:2px solid var(--border)}
td.rowh .nm{font-weight:800;font-size:13px;display:flex;align-items:center;gap:8px}
td.rowh .rl{color:var(--muted);font-size:11px}
td.rowh .hrs{font-size:11px;font-weight:700;color:var(--gold-dark);margin-top:3px}
td.cell{padding:5px;min-height:70px;height:70px;position:relative}
td.cell.today{background:color-mix(in srgb,var(--gold) 7%,transparent)}
td.cell.over{outline:2px dashed var(--gold);outline-offset:-3px;background:color-mix(in srgb,var(--gold) 14%,transparent)}
.addc{position:absolute;right:4px;bottom:4px;width:22px;height:22px;border-radius:50%;border:0;background:var(--cream);color:var(--muted);
  display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;font-size:15px;line-height:1;padding:0}
td.cell:hover .addc,td.cell:focus-within .addc{opacity:1}
@media(hover:none){.addc{opacity:.55}}
.jchip{--c:var(--gold);display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--c);border-radius:8px;
  background:color-mix(in srgb,var(--c) 17%,var(--field));padding:5px 7px;margin-bottom:4px;cursor:pointer;font-size:11.5px;line-height:1.3;
  box-shadow:0 1px 2px rgba(0,0,0,.08);color:var(--ink)}
.jchip:hover{box-shadow:0 3px 10px rgba(0,0,0,.18)}
.jchip .t{font-weight:700;color:var(--muted);font-size:10.5px;display:flex;align-items:center;gap:4px}
.jchip .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.jchip.draft{border-left-style:dashed;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 10%,var(--field)) 0 6px,var(--field) 6px 12px)}
.jchip.done{opacity:.6}.jchip.done .n{text-decoration:line-through}
.jchip.warn{outline:2px solid var(--red);outline-offset:-2px}
.jchip.dragging{opacity:.4}
.jchip svg.i{width:11px;height:11px}

.agenda-day{margin-bottom:16px}
.agenda-day h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:flex;align-items:center;gap:8px}
.agenda-day h3.today{color:var(--gold-dark)}
.jcard{--c:var(--gold);display:flex;gap:12px;align-items:stretch;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;border-left:5px solid var(--c);width:100%;text-align:left}
.jcard.draft{border-left-style:dashed}.jcard.done{opacity:.65}
.jcard .tm{min-width:62px;font-weight:800;font-size:13px}.jcard .tm small{display:block;color:var(--muted);font-weight:600}
.jcard .bd{flex:1;min-width:0}.jcard .ttl{font-weight:800;font-size:15px}
.jcard .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:14px;border:1.5px dashed var(--border);border-radius:var(--radius);text-align:center}

/* ---------- to do ---------- */
.todo-layout{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}
.lists{padding:8px;position:sticky;top:76px}
.lists button.li{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:700;font-size:13.5px;text-align:left}
.lists button.li:hover{background:var(--cream)}
.lists button.li.on{background:var(--charcoal);color:var(--gold-light)}
.lists button.li .ct{margin-left:auto;font-size:11px;color:var(--muted);font-weight:800}
.lists button.li.on .ct{color:var(--gold-light)}
.lists hr{border:0;border-top:1px solid var(--border);margin:6px 8px}
@media(max-width:820px){
  .todo-layout{grid-template-columns:1fr}
  .lists{position:static;display:flex;overflow-x:auto;gap:6px;padding:6px;scrollbar-width:none}
  .lists button.li{width:auto;white-space:nowrap;flex-shrink:0;padding:8px 12px}
  .lists hr{display:none}
}
.quick{padding:12px;margin-bottom:12px}
.quick .row1{display:flex;gap:8px}
.quick .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.quick .row2 input[type=date]{width:auto}
.staff-pick{display:flex;gap:4px;flex-wrap:wrap}
.sp{border:2px solid transparent;border-radius:99px;padding:2px;background:none;opacity:.45;transition:opacity .15s}
.sp.on{opacity:1;border-color:var(--gold)}
.task{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:6px;
  cursor:pointer;transition:box-shadow .15s}
.task:hover{box-shadow:var(--shadow)}
.circ{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:none;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0;color:transparent}
.circ:hover{border-color:var(--gold-dark);color:var(--gold-dark)}
.circ.done{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.circ svg{width:14px;height:14px;stroke-width:3}
.task .tb{flex:1;min-width:0}
.task .tt{font-weight:600;font-size:14.5px}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .tm{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-top:2px}
.task .tm .od{color:var(--red);font-weight:700}
.star{border:0;background:none;color:var(--muted);padding:4px;display:flex}
.star.on{color:var(--gold)}.star.on svg{fill:var(--gold)}
.done-hd{display:flex;align-items:center;gap:6px;background:none;border:0;font-weight:800;font-size:12.5px;color:var(--muted);padding:10px 4px;margin-top:6px}

/* ---------- sheets / dialogs ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,20,18,.55);z-index:200;backdrop-filter:blur(2px);animation:fade .15s}
.sheet{position:fixed;z-index:210;left:0;right:0;bottom:0;max-height:94vh;background:var(--card);border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:up .22s ease-out;border-top:4px solid var(--gold)}
.sheet .sh-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px 10px}
.sheet .sh-hd h2{margin:0;font-size:18px;font-weight:800}
.sheet .sh-bd{overflow:auto;padding:4px 18px 18px;flex:1}
.sheet .sh-ft{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--card)}
.sheet .sh-ft .sp-grow{flex:1}
@media(min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(680px,94vw);border-radius:20px;max-height:90vh;animation:pop .18s ease-out}
  .sheet.narrow{width:min(440px,94vw)}
}
#dialogRoot .scrim{z-index:300}#dialogRoot .sheet{z-index:310}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes pop{from{transform:translate(-50%,-48%) scale(.97);opacity:0}}
@keyframes fade{from{opacity:0}}
.fld{margin-bottom:14px}
.fld>label,.lbl{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:6px}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-sel{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--border);background:var(--field);border-radius:99px;padding:4px 12px 4px 4px;font-size:13px;font-weight:600}
.chip-sel.sq{padding:6px 12px;border-radius:10px}
.chip-sel.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--field));font-weight:800}
.swatches{display:flex;gap:8px}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--border);padding:0}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.att{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;background:var(--field)}
.att .th{width:38px;height:38px;border-radius:8px;background:var(--cream);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}
.att .th img{width:100%;height:100%;object-fit:cover}
.att .nm{flex:1;min-width:0;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .nm small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.drop{border:2px dashed var(--border);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;display:block}
.drop:hover{border-color:var(--gold)}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.scopebar{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--gold) 14%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--border));
  border-radius:12px;padding:8px 12px;margin-bottom:14px;font-size:12.5px;font-weight:700;flex-wrap:wrap}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--field);border:1px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:8px;font-weight:700;font-size:14px;text-align:left}
.menu-item:hover{background:var(--cream)}.menu-item small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.staff-row{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.step{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line-soft)}
.step.done span{text-decoration:line-through;color:var(--muted)}
.step span{flex:1}

/* ---------- placeholders ---------- */
.ph-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.ph{padding:18px;position:relative;overflow:hidden}
.ph .ico{width:44px;height:44px;border-radius:12px;background:var(--charcoal);color:var(--gold-light);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.ph h3{margin:0 0 4px;font-size:16px;font-weight:800}.ph p{margin:0 0 10px;color:var(--muted);font-size:13px}
.ph ul{margin:0;padding:0;list-style:none}
.ph li{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:4px 0;color:var(--ink)}
.ph li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);margin-top:7px;flex-shrink:0;opacity:.8}
.ph .pill{position:absolute;top:14px;right:14px}
.skel-wrap{overflow:auto;margin-top:12px;border:1px solid var(--border);border-radius:12px}
table.skel{border-collapse:collapse;width:100%;min-width:720px;font-size:12px}
table.skel th{background:var(--charcoal);color:var(--gold-light);padding:7px 8px;text-align:center;font-size:11px;letter-spacing:.5px}
table.skel td{padding:7px 8px;border-bottom:1px solid var(--line-soft);text-align:center;color:var(--muted)}
table.skel td:first-child{text-align:left;font-weight:700;color:var(--ink)}
.bar{display:inline-block;height:8px;width:70%;border-radius:4px;background:var(--line-soft)}
table.skel tr:nth-child(odd) .bar{background:var(--cream)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--charcoal-deep);color:#fff;
  padding:10px 18px;border-radius:12px;font-weight:600;font-size:13px;z-index:500;box-shadow:var(--shadow-lg);border-left:4px solid var(--gold);max-width:92vw;animation:fade .15s}
.toast.warn{border-left-color:var(--red)}
@media(max-width:640px){
  .grid3{grid-template-columns:1fr 1fr}.grid3 .fld:first-child{grid-column:1/-1}
  .staff-row{grid-template-columns:auto 1fr auto}.staff-row .role{grid-column:2/3}
  .weeklabel{min-width:0;flex:1;font-size:14px}
  .toolbar .grow{display:none}
  .week-wrap{max-height:none}
}
</style>
</head>

const FREQ=[['','Does not repeat'],['daily','Every day'],['weekdays','Every weekday (Mon–Fri)'],['weekly','Weekly'],['fortnightly','Fortnightly'],['monthly','Monthly (same date)']];

function matches(job,ds){
  const r=job.rec; if(!r) return ds===job.date;
  if(ds<job.date) return false; if(r.until&&ds>r.until) return false;
  const d=parse(ds),s=parse(job.date),dow=dowIdx(d);
  switch(r.freq){
    case 'daily':return true;
    case 'weekdays':return dow<5;
    case 'weekly':case 'fortnightly':{
      const days=r.days&&r.days.length?r.days:[dowIdx(s)];
      if(!days.includes(dow)) return false;
      if(r.freq==='weekly') return true;
      const wk=Math.round((parse(mondayOf(ds))-parse(mondayOf(job.date)))/(7*864e5));
      return wk%2===0;}
    case 'monthly':return d.getDate()===s.getDate();
  }
  return false;
}
function occurrencesOn(ds){
  const out=[];
  for(const job of S.jobs){
    if(!matches(job,ds)) continue;
    const ex=job.exc&&job.exc[ds]; if(ex&&ex.skip) continue;
    const m={...job,...(ex||{})};
    out.push({key:job.id+'|'+ds,jobId:job.id,date:ds,recurring:!!job.rec,job:m,master:job});
  }
  return out.sort((a,b)=>toMin(a.job.start)-toMin(b.job.start));
}
const occFor=(jobId,ds)=>occurrencesOn(ds).find(o=>o.jobId===jobId);
function conflictKeys(ds){
  const occ=occurrencesOn(ds),bad=new Set();
  S.staff.forEach(s=>{
    const mine=occ.filter(o=>o.job.staff.includes(s.id));
    for(let i=0;i<mine.length;i++)for(let j=i+1;j<mine.length;j++){
      const a=mine[i].job,b=mine[j].job;
      if(toMin(a.start)<toMin(b.end)&&toMin(b.start)<toMin(a.end)){bad.add(mine[i].key);bad.add(mine[j].key)}
    }});
  return bad;
}

async function saveJob(){
  collectJob();const d=SH.d,scope=SH.scope;
  if(!d.title.trim()){toast('Give the job a title',true);$('#jf-title')?.focus();return}
  if(!d.date){toast('Choose a date',true);return}
  if(d.rec&&(d.rec.freq==='weekly'||d.rec.freq==='fortnightly')&&!(d.rec.days||[]).length)d.rec.days=[dowIdx(parse(d.date))];
  const fields={title:d.title.trim(),start:d.start,end:d.end,staff:[...d.staff],brief:d.brief,status:d.status};
  let focusDate=d.date,jobRef=null;
  if(d.mode==='new'){
    const j={id:uid(),date:d.date,color:d.color,published:d.published,att:d.att,rec:d.rec&&d.rec.freq?d.rec:null,exc:{},...fields};S.jobs.push(j);jobRef=j;
  }else{
    const m=S.jobs.find(j=>j.id===d.jobId);jobRef=m;
    if(m.rec&&scope==='one'){
      m.exc=m.exc||{};
      if(d.date!==d.occDate){ // moved: skip original, make one-off
        m.exc[d.occDate]={skip:true};
        S.jobs.push({id:uid(),date:d.date,color:m.color,published:d.published,att:m.att.map(a=>({...a})),rec:null,exc:{},...fields});
      }else m.exc[d.occDate]={...fields};
      m.published=d.published;m.color=d.color;
    }else{
      const before=[...(m.att||[])];Object.assign(m,fields,{date:d.date,color:d.color,published:d.published,att:d.att,rec:d.rec&&d.rec.freq?d.rec:null});
      if(!m.rec)m.exc={};
      gcFiles(before.filter(a=>!d.att.some(x=>x.id===a.id)));
    }
  }
  save();
  // conflict notice
  let warn='';const ds=focusDate;if(conflictKeys(ds).size){const bad=occurrencesOn(ds).filter(o=>conflictKeys(ds).has(o.key)&&o.jobId===jobRef.id);if(bad.length){const names=fields.staff.filter(id=>occurrencesOn(ds).some(o=>o.jobId!==jobRef.id&&o.job.staff.includes(id)&&toMin(o.job.start)<toMin(fields.end)&&toMin(fields.start)<toMin(o.job.end))).map(id=>staffById(id)?.name).filter(Boolean);if(names.length)warn=`${names.join(', ')} double-booked on ${longDate(ds)}`}}
  closeSheet();
  if(ds<UI.week||ds>addDays(UI.week,6))UI.week=mondayOf(ds);
  render();toast(warn?'Saved — '+warn:'Job saved',!!warn);
}
async function deleteJob(){
  const d=SH.d,m=S.jobs.find(j=>j.id===d.jobId);if(!m)return;
  if(m.rec){
    const c=await askChoice('Delete recurring job','Delete just this occurrence or the whole series?',[{v:'one',t:'This job only'},{v:'all',t:'Entire series',cls:'danger'}]);
    if(!c)return;
    if(c==='one'){m.exc=m.exc||{};m.exc[d.occDate]={skip:true}}else{S.jobs=S.jobs.filter(j=>j.id!==m.id);gcFiles(m.att||[])}
  }else{
    const c=await askChoice('Delete job',`Delete “${m.title}”?`,[{v:'del',t:'Delete',cls:'danger'}]);if(c!=='del')return;
    S.jobs=S.jobs.filter(j=>j.id!==m.id);gcFiles(m.att||[]);
  }
  save();closeSheet();render();toast('Job deleted');
}

function nextDue(due,rep){
  const base=due||today();
  switch(rep){case 'daily':return addDays(base,1);case 'weekdays':{let n=addDays(base,1);while(dowIdx(parse(n))>4)n=addDays(n,1);return n}
   case 'weekly':return addDays(base,7);case 'fortnightly':return addDays(base,14);
   case 'monthly':{const d=parse(base),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return fmt(d)}}
  return base;
}
function tasksFor(list){
  const T=UI.todo,sf=T.staff;let r=S.tasks.filter(t=>!sf||t.staff.includes(sf));
  const open=r.filter(t=>!t.done),done=r.filter(t=>t.done);
  const pick=a=>list==='myday'?a.filter(t=>t.myday===today()||(t.due===today())):list==='important'?a.filter(t=>t.important):list==='planned'?a.filter(t=>t.due):list==='all'?a:a.filter(t=>t.list===list);
  let o=pick(open);const dn=pick(done);
  if(list==='planned')o.sort((a,b)=>a.due.localeCompare(b.due));
  return {open:o,done:dn};
}

  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  sheet(`<div class="sh-hd"><h2>Menu</h2><button class="icon-btn" style="background:var(--cream);color:var(--ink);border-color:var(--border)" data-act="close">${icon('x')}</button></div><div class="sh-bd">
   <button class="menu-item" data-act="staffsheet">${icon('users')}<span>Staff &amp; roles<small>${S.staff.length} staff members</small></span></button>
   <button class="menu-item" data-act="tplsheet">${icon('edit')}<span>Job brief template<small>Default text for every new job</small></span></button>
   <button class="menu-item" data-act="templates">${icon('book')}<span>Job templates<small>${S.templates.length} saved (recurring jobs with attachments)</small></span></button>
   <button class="menu-item" data-act="theme">${icon('moon')}<span>Theme<small>Currently ${dark?'dark':'light'} — tap to switch</small></span></button>
   <button class="menu-item" data-act="backup">${icon('data')}<span>Backup / restore<small>Copy or paste your data</small></span></button>
   <button class="menu-item" data-act="clearall">${icon('trash')}<span>Clear sample data<small>Remove all jobs and tasks, keep staff</small></span></button>
   <div class="hint" style="text-align:center;margin-top:10px">Keystone Ops · build ${BUILD_VERSION} · data is stored on this device</div></div>`,{narrow:true});
}
function staffSheet(){
  sheet(`<div class="sh-hd"><h2>Staff &amp; roles</h2><button class="icon-btn" style="background:var(--cream);color:var(--ink);border-color:var(--border)" data-act="close">${icon('x')}</button></div><div class="sh-bd">
   ${S.staff.map(s=>`<div class="staff-row">${avatar(s.id,'lg')}<input value="${esc(s.name)}" data-live-staff="name" data-id="${s.id}" placeholder="Name"><input class="role" value="${esc(s.role||'')}" data-live-staff="role" data-id="${s.id}" placeholder="Role"><button class="btn sm danger" data-act="staffdel" data-id="${s.id}" aria-label="Remove">${icon('trash','sm')}</button></div>`).join('')}
   <button class="btn" data-act="staffadd">${icon('plus','sm')}Add staff member</button></div><div class="sh-ft"><span class="sp-grow"></span><button class="btn gold" data-act="menu">Done</button></div>`);
}
function briefTplSheet(){
  sheet(`<div class="sh-hd"><h2>Job brief template</h2><button class="icon-btn" style="background:var(--cream);color:var(--ink);border-color:var(--border)" data-act="close">${icon('x')}</button></div><div class="sh-bd">
   <p class="hint" style="margin-top:0">This text is placed in the brief of every new job. Keep one heading per line (e.g. “Location:”) so the schedule can show the location and team leader on job cards.</p>
   <textarea id="bt" rows="12" style="min-height:240px">${esc(S.settings.briefTpl)}</textarea></div>
   <div class="sh-ft"><button class="btn" data-act="btreset">Restore default</button><span class="sp-grow"></span><button class="btn gold" data-act="btsave">Save template</button></div>`);
}
function backupSheet(){
  sheet(`<div class="sh-hd"><h2>Backup / restore</h2><button class="icon-btn" style="background:var(--cream);color:var(--ink);border-color:var(--border)" data-act="close">${icon('x')}</button></div><div class="sh-bd">
   <div class="fld"><label for="bk">Data (JSON)</label><textarea id="bk" rows="8" style="min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:12px">${esc(JSON.stringify(S))}</textarea>
   <div class="hint">Copy this to back up. To restore, paste a backup here and press Restore. Attachment files are kept on this device and are not included.</div></div></div>
   <div class="sh-ft"><button class="btn" data-act="bkcopy">${icon('copy','sm')}Copy</button><span class="sp-grow"></span><button class="btn danger" data-act="bkrestore">Restore from text</button></div>`);
}

/* ================= events ================= */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;
  if(a==='openjob'||a==='opentask'){ if(e.target.closest('[data-act="tdone"],[data-act="tstar"]'))return; }
  switch(a){
   case 'tab':UI.tab=t.dataset.t;try{localStorage.setItem('ks_tab',UI.tab)}catch(_){}window.scrollTo(0,0);render();break;
   case 'close':closeSheet();break;
   case 'menu':menuSheet();break;
   case 'wk':UI.week=t.dataset.n==='0'?mondayOf(today()):addDays(UI.week,+t.dataset.n);render();break;
   case 'view':UI.view=t.dataset.v;render();break;
   case 'newjob':openNewJob(t.dataset.date||today(),t.dataset.staff||'');break;
   case 'openjob':openJob(id,t.dataset.date);break;
   case 'jscope':collectJob();{const m=S.jobs.find(j=>j.id===SH.d.jobId);SH.scope=t.dataset.v;SH.d=draftFrom(m,SH.d.occDate,SH.scope)}renderJobSheet();break;
   case 'jstaff':collectJob();{const s=SH.d.staff,i=s.indexOf(id);i<0?s.push(id):s.splice(i,1)}renderJobSheet();break;
   case 'jcolor':collectJob();SH.d.color=t.dataset.c;renderJobSheet();break;
   case 'jday':collectJob();{const r=SH.d.rec,i=+t.dataset.i;r.days=r.days||[];const k=r.days.indexOf(i);k<0?r.days.push(i):r.days.splice(k,1)}renderJobSheet();break;
   case 'jbrieftpl':collectJob();SH.d.brief=S.settings.briefTpl;renderJobSheet();break;
   case 'jsave':saveJob();break;
   case 'jdel':deleteJob();break;
   case 'jdup':collectJob();{const d=SH.d;const nd=newDraft(d.date,'');Object.assign(nd,{title:d.title+' (copy)',start:d.start,end:d.end,staff:[...d.staff],color:d.color,brief:d.brief,att:d.att.map(x=>({...x})),status:'scheduled',published:d.published});SH={type:'job',scope:'all',d:nd};renderJobSheet();toast('Duplicated — adjust and save')}break;
   case 'jtpl':saveTemplate();break;
   case 'attopen':{const b=await fileGet(id);if(!b){toast('File not available on this device',true);break}const u=URL.createObjectURL(b);try{const w=window.open(u,'_blank');if(!w)throw 0}catch(_){const l=document.createElement('a');l.href=u;l.target='_blank';l.rel='noopener';l.click()}}break;
   case 'attrm':collectJob();SH.d.att=SH.d.att.filter(x=>x.id!==id);renderJobSheet();break;
   case 'templates':templatesSheet();break;
   case 'tplUse':{const tp=S.templates.find(x=>x.id===id);if(tp)openNewJob(UI.week===mondayOf(today())?today():UI.week,'',tp)}break;
   case 'tplDel':{const tp=S.templates.find(x=>x.id===id);const c=await askChoice('Delete template',`Delete “${tp.name}”? Jobs already scheduled from it are not affected.`,[{v:'del',t:'Delete',cls:'danger'}]);if(c==='del'){S.templates=S.templates.filter(x=>x.id!==id);gcFiles(tp.att);save();templatesSheet()}}break;
   case 'tlist':UI.todo.list=id;render();break;
   case 'toggledone':UI.todo.showDone=!UI.todo.showDone;render();break;
   case 'newlist':{const n=await askText('New list','','List name');if(n&&n.trim()){const l={id:uid(),name:n.trim()};S.lists.push(l);UI.todo.list=l.id;save();render()}}break;
   case 'listmenu':{const l=S.lists.find(x=>x.id===UI.todo.list);const c=await askChoice('List: '+l.name,'Rename it or delete it. Deleting moves its tasks to another list.',[{v:'ren',t:'Rename'},{v:'del',t:'Delete list',cls:'danger'}]);
      if(c==='ren'){const n=await askText('Rename list',l.name);if(n&&n.trim()){l.name=n.trim();save();render()}}
      else if(c==='del'){const rest=S.lists.filter(x=>x.id!==l.id);if(!rest.length){toast('Keep at least one list',true);break}S.tasks.forEach(tk=>{if(tk.list===l.id)tk.list=rest[0].id});S.lists=rest;UI.todo.list='all';save();render()}}break;
   case 'qstaff':{const s=UI.todo.draft.staff,i=s.indexOf(id);i<0?s.push(id):s.splice(i,1);t.classList.toggle('on');UI.todo.draft.title=$('#qaTitle').value}break;
   case 'qadd':addTask();break;
   case 'tdone':e.stopPropagation();toggleDone(id);break;
   case 'tstar':{e.stopPropagation();const tk=S.tasks.find(x=>x.id===id);tk.important=!tk.important;save();render();if(SH&&SH.type==='task')renderTaskSheet()}break;
   case 'opentask':openTask(id);break;
   case 'tstaff':{const tk=S.tasks.find(x=>x.id===SH.id),i=tk.staff.indexOf(id);i<0?tk.staff.push(id):tk.staff.splice(i,1);save();renderTaskSheet();render()}break;
   case 'tmyday':{const tk=S.tasks.find(x=>x.id===SH.id);tk.myday=tk.myday===today()?'':today();save();renderTaskSheet();render()}break;
   case 'stepdone':{const tk=S.tasks.find(x=>x.id===SH.id),s=tk.steps.find(x=>x.id===id);s.d=!s.d;save();renderTaskSheet();render()}break;
   case 'steprm':{const tk=S.tasks.find(x=>x.id===SH.id);tk.steps=tk.steps.filter(x=>x.id!==id);save();renderTaskSheet();render()}break;
   case 'tdel':{const tk=S.tasks.find(x=>x.id===SH.id);const c=await askChoice('Delete task',`Delete “${tk.title}”?`,[{v:'del',t:'Delete',cls:'danger'}]);if(c==='del'){S.tasks=S.tasks.filter(x=>x.id!==tk.id);save();closeSheet();render()}}break;
   case 'phsec':UI.ph[t.dataset.g]=id;render();break;
   case 'staffsheet':staffSheet();break;
   case 'staffadd':{S.staff.push({id:uid(),name:'New staff',role:'',color:STAFF_COLORS[S.staff.length%STAFF_COLORS.length]});save();staffSheet();render()}break;
   case 'staffdel':{const s=staffById(id);const c=await askChoice('Remove staff',`Remove ${s.name}? They'll be taken off all jobs and tasks.`,[{v:'del',t:'Remove',cls:'danger'}]);if(c==='del'){S.staff=S.staff.filter(x=>x.id!==id);S.jobs.forEach(j=>{j.staff=j.staff.filter(x=>x!==id);Object.values(j.exc||{}).forEach(x=>{if(x.staff)x.staff=x.staff.filter(y=>y!==id)})});S.tasks.forEach(tk=>tk.staff=tk.staff.filter(x=>x!==id));S.templates.forEach(tp=>tp.staff=tp.staff.filter(x=>x!==id));save();staffSheet();render()}}break;
   case 'tplsheet':briefTplSheet();break;
   case 'btsave':S.settings.briefTpl=$('#bt').value;save();toast('Brief template saved');menuSheet();break;
   case 'btreset':$('#bt').value=DEFAULT_BRIEF;break;
   case 'theme':{const n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('ks_theme',n)}catch(_){}menuSheet()}break;
   case 'backup':backupSheet();break;
   case 'bkcopy':{const ta=$('#bk');ta.select();try{await navigator.clipboard.writeText(ta.value);toast('Copied')}catch(_){try{document.execCommand('copy');toast('Copied')}catch(__){toast('Select the text and copy it manually',true)}}}break;
   case 'bkrestore':{try{const o=JSON.parse($('#bk').value);if(!o||o.v!==1||!Array.isArray(o.jobs))throw 0;const c=await askChoice('Restore backup','This replaces everything currently in the app.',[{v:'ok',t:'Replace data',cls:'danger'}]);if(c==='ok'){S=o;S.settings=S.settings||{briefTpl:DEFAULT_BRIEF};save();closeSheet();render();toast('Restored')}}catch(_){toast('That doesn’t look like a valid backup',true)}}break;
   case 'clearall':{const c=await askChoice('Clear sample data','Removes all jobs, templates, tasks and extra lists. Staff are kept.',[{v:'ok',t:'Clear',cls:'danger'}]);if(c==='ok'){S.jobs=[];S.templates=[];S.tasks=[];S.lists=[{id:'l1',name:'Tasks'}];UI.todo.list='myday';save();closeSheet();render();toast('Cleared')}}break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='jf-file'){(async()=>{collectJob();for(const f of t.files){const id=uid();await filePut(id,f);SH.d.att.push({id,name:f.name,size:f.size,type:f.type})}renderJobSheet()})();return}
  if(t.dataset.chg==='sfilter'){UI.sFilter=t.value;render()}
  if(t.dataset.chg==='tstaff'){UI.todo.staff=t.value;render()}
  if(t.dataset.chg==='jfreq'){collectJob();const r=SH.d.rec;if(r&&(r.freq==='weekly'||r.freq==='fortnightly')&&!(r.days||[]).length)r.days=[dowIdx(parse(SH.d.date||today()))];renderJobSheet()}
  if(t.dataset.live&&SH&&SH.type==='task'){const tk=S.tasks.find(x=>x.id===SH.id);tk[t.dataset.live]=t.value;save();render()}
  if(t.id==='qaDue')UI.todo.draft.due=t.value;
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.live&&SH&&SH.type==='task'&&(t.dataset.live==='title'||t.dataset.live==='notes')){const tk=S.tasks.find(x=>x.id===SH.id);tk[t.dataset.live]=t.value;save()}
  if(t.dataset.liveStaff){const s=staffById(t.dataset.id);s[t.dataset.liveStaff]=t.value;save();if(t.dataset.liveStaff==='name')$$('.staff-row').forEach(r=>{})}
  if(t.id==='qaTitle')UI.todo.draft.title=t.value;
});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.liveStaff)render()});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='qaTitle'){e.preventDefault();addTask()}
  if(e.key==='Enter'&&e.target.id==='tk-step'){e.preventDefault();const v=e.target.value.trim();if(!v)return;const tk=S.tasks.find(x=>x.id===SH.id);tk.steps.push({id:uid(),t:v,d:false});save();renderTaskSheet();render();$('#tk-step')?.focus()}
  if(e.key==='Escape'&&!$('#dialogRoot').innerHTML&&$('#sheetRoot').innerHTML)closeSheet();
});
/* drag & drop on schedule */
let dragInfo=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.jchip');if(!c)return;dragInfo={id:c.dataset.id,date:c.dataset.date,from:(c.closest('td.cell')?.dataset.drop||'|').split('|')[0]};c.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',c.dataset.id)}catch(_){}});
document.addEventListener('dragend',e=>{$$('.dragging').forEach(x=>x.classList.remove('dragging'));$$('.over').forEach(x=>x.classList.remove('over'));dragInfo=null});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('td.cell');if(c&&dragInfo){e.preventDefault();$$('.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('drop',e=>{
  const c=e.target.closest&&e.target.closest('td.cell');if(!c||!dragInfo)return;e.preventDefault();
  const [toStaff,toDate]=c.dataset.drop.split('|'),di=dragInfo;dragInfo=null;
  const m=S.jobs.find(j=>j.id===di.id);if(!m)return;
  const o=occFor(di.id,di.date);const cur=o?o.job.staff:m.staff;
  let staff=cur.filter(x=>x!==di.from);if(toStaff&&!staff.includes(toStaff))staff.push(toStaff);
  if(toDate===di.date&&toStaff===di.from){render();return}
  if(!m.rec){m.date=toDate;m.staff=staff}
  else{
    m.exc=m.exc||{};
    if(toDate===di.date){m.exc[di.date]={...(m.exc[di.date]||{}),staff}}
    else{m.exc[di.date]={skip:true};const cp={...(o?o.job:m),id:uid(),date:toDate,staff,rec:null,exc:{},att:(m.att||[]).map(a=>({...a})),published:m.published};delete cp.skip;S.jobs.push(cp)}
  }
  save();render();toast(toStaff?`Allocated to ${staffById(toStaff)?.name}`:'Moved to Open jobs');
});

render();
</script>
</body>
</html>
